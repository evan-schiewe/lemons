<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lemons Race Viewer</title>
  </head>
  <body>
    <div id="app">
      <header class="hero">
        <div>
          <h1>Race Viewer</h1>
          <p>
            Witness the citrus
          </p>
        </div>
        <div id="hero-actions-host" hidden>
          <div id="data-actions" class="hero-actions">
            <label class="button primary" for="csv-input">Import CSV</label>
            <input id="csv-input" type="file" accept=".csv,text/csv" multiple hidden />
            <button id="export-json" class="button secondary" type="button">Export JSON</button>
            <button id="export-sqlite" class="button secondary" type="button">Export SQLite</button>
            <label class="button ghost" for="sqlite-input">Restore SQLite</label>
            <input id="sqlite-input" type="file" accept=".sqlite,.db,application/x-sqlite3,application/vnd.sqlite3" hidden />
          </div>
          <div id="sync-controls" class="sync-controls" hidden>
            <span id="sync-status" class="status-pill">Local only</span>
            <button id="sync-connect" class="button ghost" type="button" hidden>Connect Cloud Sync</button>
          </div>
        </div>
      </header>

      <main class="layout">
        <!-- Sticky tab panel with chart and annotations -->
        <div class="sticky-chart-panel">
          <div class="tab-switcher">
            <button class="tab-button active" data-tab="chart" type="button">Charts</button>
            <button class="tab-button" data-tab="timeline" type="button">Timeline</button>
            <button class="tab-button" data-tab="annotations" type="button">Annotations</button>
            <button id="data-tab-button" class="tab-button" data-tab="data" type="button" hidden>Data</button>
          </div>
          <div class="tab-content-wrapper">
            <div id="chart-tab" class="tab-content active">
              <section class="panel chart-panel sticky-content">
                <div id="lap-time-chart" class="chart-surface"></div>
              </section>
              <section class="panel controls-panel">
                <div class="panel-header">
                  <h2>Filters</h2>
                </div>
                <div class="filters-grid">
                  <label>
                    <span>Race</span>
                    <select id="race-select"></select>
                  </label>
                  <label>
                    <span>Driver</span>
                    <select id="driver-filter">
                      <option value="">All drivers</option>
                    </select>
                  </label>
                  <label>
                    <span>Search</span>
                    <input id="search-filter" type="search" placeholder="Driver, note, incident" />
                  </label>
                  <label>
                    <span>Lap Range</span>
                    <div class="range-pair">
                      <input id="lap-min" type="number" min="1" placeholder="Min" />
                      <input id="lap-max" type="number" min="1" placeholder="Max" />
                    </div>
                  </label>
                  <div class="summary-toggle-control">
                    <label class="summary-toggle-label" for="summary-green-only">
                      <input id="summary-green-only" type="checkbox" />
                      <span>Filter to green flag laps (0-95%)</span>
                    </label>
                  </div>
                </div>
                <div id="import-status" class="inline-note">No race loaded.</div>
              </section>

              <section class="dashboard-grid" id="summary-cards"></section>

              <section class="panel table-panel">
                <div class="panel-header">
                  <h2>Lap Table</h2>
                </div>
                <div class="table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th data-sort="lap_number">Lap</th>
                        <th data-sort="lap_start_offset_ms">Lap Start</th>
                        <th data-sort="driver_name">Driver</th>
                        <th data-sort="lap_time_ms">Lap Time</th>
                        <th data-sort="position_value">Pos</th>
                        <th data-sort="speed_mph">MPH</th>
                        <th data-sort="gap_ahead_display">Gap Ahead</th>
                        <th data-sort="gap_leader_display">Gap Leader</th>
                        <th data-sort="flags">Flags</th>
                      </tr>
                    </thead>
                    <tbody id="lap-table-body"></tbody>
                  </table>
                </div>
              </section>
            </div>
            <div id="annotations-tab" class="tab-content">
              <section class="sticky-content">
                <div class="annotation-subtab-switcher" role="tablist" aria-label="Annotation views">
                  <button
                    class="annotation-subtab-button active"
                    data-annotation-tab="editor"
                    type="button"
                    role="tab"
                    aria-selected="true"
                  >
                    List / Editor
                  </button>
                  <button
                    class="annotation-subtab-button"
                    data-annotation-tab="helper"
                    type="button"
                    role="tab"
                    aria-selected="false"
                  >
                    Review Helper
                  </button>
                </div>

                <div class="annotation-subtab-content active" id="annotation-editor-tab" role="tabpanel">
                  <div id="annotation-panel-container" class="annotation-panel"></div>
                </div>

                <div class="annotation-subtab-content" id="annotation-helper-tab" role="tabpanel" hidden>
                  <div class="annotations-workspace-section">
                    <h3 class="annotations-section-title">Review Queue</h3>
                    <p class="annotations-section-copy">Work outlier laps in sequence and jump into detailed edits when needed.</p>
                    <div id="annotation-helper-container" class="annotation-helper"></div>
                  </div>
                </div>
              </section>
            </div>
            <div id="timeline-tab" class="tab-content">
              <section class="timeline-tab-panel sticky-content">
                <div id="timeline-container" class="timeline-container"></div>
              </section>
            </div>
            <div id="data-tab" class="tab-content">
              <section class="panel data-tab-panel sticky-content">
                <div class="panel-header">
                  <h2>Data</h2>
                  <span class="panel-subtitle">Import, export, and restore race data</span>
                </div>
                <div id="data-actions-slot"></div>
              </section>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
